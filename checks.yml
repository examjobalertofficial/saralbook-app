name: Checks (analyse + tests)

# Quick safety net: runs on every branch except main (main already builds the APK)
# and on every pull request. No secrets needed.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore: [main, master]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test
