name: Build SaralBook APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and iOS project files
        run: flutter create --org com.saralbook --project-name app --platforms=android,ios .

      - name: Configure app
        run: python3 tool/configure_android.py
      - name: Set Android compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          for path in files:
              if path.exists():
                  text = path.read_text()

                  text = re.sub(
                      r'compileSdk\s*=\s*\d+',
                      'compileSdk = 36',
                      text
                  )

                  text = re.sub(
                      r'compileSdk\s+\d+',
                      'compileSdk 36',
                      text
                  )

                  path.write_text(text)
                  print(f"Updated compileSdk to 36 in {path}")
          PY
      - run: rm -rf test
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart run flutter_native_splash:create

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Build Play Store AAB
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: SaralBook-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SaralBook-PlayStore-Bundle
          path: build/app/outputs/bundle/release/app-release.aab
