name: Build SaralBook APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and iOS project files
        run: |
          flutter create \
            --org com.saralbook \
            --project-name app \
            --platforms=android,ios \
            .

      - name: Configure app
        run: python3 tool/configure_android.py

      - name: Configure Android build versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # -------------------------------
          # Fix Kotlin version
          # -------------------------------
          settings = Path("android/settings.gradle.kts")

          if not settings.exists():
              print("ERROR: android/settings.gradle.kts not found")
              raise SystemExit(1)

          text = settings.read_text()

          text = text.replace(
              'id("org.jetbrains.kotlin.android") version "2.2.20"',
              'id("org.jetbrains.kotlin.android") version "2.1.20"'
          )

          text = text.replace(
              'id("org.jetbrains.kotlin.android") version "2.2.21"',
              'id("org.jetbrains.kotlin.android") version "2.1.20"'
          )

          settings.write_text(text)

          print("Kotlin configuration:")
          for line in text.splitlines():
              if "kotlin" in line.lower():
                  print(line)

          # -------------------------------
          # Force compileSdk 36
          # -------------------------------
          app = Path("android/app/build.gradle.kts")

          if not app.exists():
              print("ERROR: android/app/build.gradle.kts not found")
              raise SystemExit(1)

          app_text = app.read_text()

          app_text = app_text.replace(
              "compileSdk = flutter.compileSdkVersion",
              "compileSdk = 36"
          )

          app_text = app_text.replace(
              "compileSdk flutter.compileSdkVersion",
              "compileSdk 36"
          )

          app.write_text(app_text)

          print("compileSdk configuration:")
          for line in app_text.splitlines():
              if "compileSdk" in line:
                  print(line)
          PY

      - name: Remove test directory
        run: rm -rf test

      - name: Get dependencies
        run: flutter pub get

      - name: Clean Flutter build
        run: flutter clean

      - name: Get dependencies again
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Verify launcher icons
        run: |
          echo "========== Launcher Icon Files =========="

          find android/app/src/main/res -type f \
            \( -name "ic_launcher*" -o -name "ic_launcher_foreground*" \) \
            -print

          echo "========================================="

      - name: Generate native splash
        run: dart run flutter_native_splash:create

      - name: Verify compileSdk
        run: |
          echo "========== Android compileSdk =========="
          grep -R "compileSdk" android/app || true
          echo "========================================"

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Build Play Store AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SaralBook-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: SaralBook-PlayStore-Bundle
          path: build/app/outputs/bundle/release/app-release.aab
