name: Build SaralBook APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and iOS project files
        run: flutter create --org com.saralbook --project-name app --platforms=android,ios .

      - name: Configure app
        run: python3 tool/configure_android.py

      - name: Force compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")

          if path.exists():
              text = path.read_text()

              text = text.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 36"
              )

              text = text.replace(
                  "compileSdk flutter.compileSdkVersion",
                  "compileSdk 36"
              )

              path.write_text(text)

              print("Final compileSdk configuration:")
              for line in path.read_text().splitlines():
                  if "compileSdk" in line:
                      print(line)
          else:
              print("ERROR: android/app/build.gradle.kts not found")
              raise SystemExit(1)

      - name: Remove test directory
        run: rm -rf test

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        run: dart run flutter_native_splash:create

      - name: Verify compileSdk
        run: |
          echo "========== Android compileSdk =========="
          grep -R "compileSdk" android/app || true
          echo "========================================"

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Build Play Store AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SaralBook-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: SaralBook-PlayStore-Bundle
          path: build/app/outputs/bundle/release/app-release.aab
