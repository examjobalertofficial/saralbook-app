name: app
description: SaralBook - all SaralBook platforms in one app.
publish_to: 'none'
version: 2.5.1+28

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  http: ^1.2.2
  pdfrx: ^2.6.5
  image: ^4.8.0
  path_provider: ^2.1.5
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  pdf: ^3.13.0
  archive: ^4.0.9
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.2.0
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.1
  app_links: ^6.3.2
  onesignal_flutter: ^5.3.0
  share_plus: ^10.1.4
  package_info_plus: ^8.1.3
  file_picker: ^10.3.8
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#1E5AA8"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"

flutter_native_splash:
  color: "#EAF2FF"
  color_dark: "#EAF2FF"
  image: assets/branding/logo.png

  android_12:
    color: "#EAF2FF"
    color_dark: "#EAF2FF"
    image: assets/branding/splash_icon.png
    icon_background_color: "#2A356B"
    icon_background_color_dark: "#2A356B"

# shared_preferences_android 2.5.0 (17 Oct 2026) crashes release builds at start-up.
# Stay on the 2.4.x line, which is what phase17 was built with.
dependency_overrides:
  shared_preferences_android: '>=2.4.0 <2.5.0'
